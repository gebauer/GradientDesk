# Short alias: one origin keeps the browser storage (saved methods) in one place.
server {
  listen 80;
  listen [::]:80;
  server_name gradidesk.xcience.net;
  return 301 https://gradientdesk.xcience.net$request_uri;
}

server {
  listen 80 default_server;
  listen [::]:80 default_server;
  root /usr/share/nginx/html;

  # add_header in a location replaces all inherited headers, so each block repeats the security headers.
  location / {
    try_files $uri /index.html;
    include /etc/nginx/security-headers.conf;
  }
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    include /etc/nginx/security-headers.conf;
  }
  location = /index.html {
    add_header Cache-Control "no-cache";
    include /etc/nginx/security-headers.conf;
  }
}
